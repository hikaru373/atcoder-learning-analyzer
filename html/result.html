<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="icon" href="/static/images/logo_input.ico">
    <link rel="stylesheet" href="/static/css/result.css">
</head>
<body>

<div class="container">

    
    <h1><a href="https://atcoder.jp/users/{{ user }}" target="_blank" class="profile-link">{{ user }}</a></h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% else %}

        <p class="info">
            推定レーティング: 
            <span style="color: {{ color }};">{{ rating }}</span>
        </p>

        <p class="info">
            <a href="https://kenkoooo.com/atcoder/#/list?fromDiff={{ from_diff }}&toDiff={{ to_diff }}" target="_blank">
                推奨Diff:<span style="color: {{ color }};">{{ from_diff }} - {{ to_diff }}</span>
            </a>
        </p>
        <a href="https://atcoder.jp/contests/{{ random_problem.id[:-2] }}/tasks/{{ random_problem.id }}" target="_blank" class="random-button c{{ color[1:] }}" id="random-link">🎲 おすすめランダム問題 β版<br>
            <small id="problemID_reload">{{ random_problem.id }} (Diff {{ random_problem.difficulty }})</small>
        </a>
        <div class="reload-area">
            <button class="reload-button" onclick="reloadRandom(this)">
                <span class="dice">🎲</span>
                <span class="reload-text">別の問題を引く</span>
            </button>
        </div>
    {% endif %}
</div>

    <footer>
        <div class="footer-links">
            <a href="/about">このサイトについて</a>
            <a href="https://hikaru373.github.io/portfolio/" target="_blank">製作者</a>
            <a href="https://github.com/hikaru373/atcoder-learning-analyzer" target="_blank">GitHub</a>
            <a href="https://forms.gle/PiDUpJXJmxxBMm5K7" target="_blank">お問い合わせ</a>
        </div>
    <p>© 2026 AtCoder Learning Analyzer</p>
    </footer>

    <script>
        const rating = {{ rating }};
        async function reloadRandom(button) {
            // ボタン連打防止
            button.disabled = true;

            // サイコロを回す
            const dice = button.querySelector(".dice");
            const text = button.querySelector(".reload-text");

            text.textContent = "抽選中...";
            dice.classList.remove("roll");
            void dice.offsetWidth;   // アニメーションをリセット
            dice.classList.add("roll");

            // 1秒待つ
            await new Promise(resolve => setTimeout(resolve, 1000));

            const res = await fetch(`/random?rating=${rating}`);
            const data = await res.json();
            const p = data.random_problem;
            const link = document.getElementById("random-link");
            const problemID_reload = document.getElementById("problemID_reload");
            link.href =`https://atcoder.jp/contests/${p.id.slice(0,-2)}/tasks/${p.id}`;
            problemID_reload.innerHTML = `${p.id} (Diff ${p.difficulty})`;
            text.textContent = "別の問題を引く";
            button.disabled = false;
        }
    </script>
</body>
</html>
