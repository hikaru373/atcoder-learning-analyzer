<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="icon" href="/static/images/logo_input.ico">
    <link rel="stylesheet" href="/static/css/result.css">
</head>
<body>

<div class="container">

    <h1><a href="https://atcoder.jp/users/{{ user }}" target="_blank">{{ user }}</a></h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% else %}

        <p class="info">
            推定レーティング: 
            <span><font color="{{ color }}">{{ rating }}</font></span>
        </p>

        <p class="info">
            推奨Diff:
            <span><font color="{{ color }}">{{ from_diff }} - {{ to_diff }}</font></span>
        </p>

        {% if cached %}
            <p class="cached">
                Redisキャッシュから取得
            </p>
        {% endif %}

        <a href="{{ url }}" target="_blank" class="button">
            オススメ問題一覧
        </a>
        <p><a href="https://atcoder.jp/contests/{{ random_problem.id[:-2] }}/tasks/{{ random_problem.id }}" target="_blank">おすすめランダム問題 β版（問題番号：{{ random_problem.id }}、難易度：{{ random_problem.difficulty }}）</a></p>
    {% endif %}

</div>

</body>
</html>
